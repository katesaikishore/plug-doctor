name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: CLI runs against this runner's real USB stack
        run: node bin/plug-doctor.js list --no-network

  # The whole app, launched in demo mode and driven like a person would drive it.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm run e2e
        env:
          PLUG_DOCTOR_E2E_OUT: ${{ runner.temp }}/e2e
      - name: Keep the screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e
