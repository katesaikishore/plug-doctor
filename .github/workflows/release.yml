name: Release

# Push a tag such as v0.1.0, or run this workflow by hand from the Actions tab,
# to build the installers on macOS, Windows and Linux. A manual run creates the
# tag for the version in package.json at the commit it runs on.
# The installers are attached to a DRAFT GitHub release: look it over, then publish it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag must match the version in package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
              exit 1
            fi
          elif ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            # Started by hand: create the version's tag at the commit being built.
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      # One system at a time: parallel jobs can race to create the same draft release.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the installers and attach them to the draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple or Windows signing certificate yet: build unsigned, and do not search for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
